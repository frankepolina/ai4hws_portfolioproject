[project]
name = "portfolioproject"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "frankepolina", email = "franke.polina@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "cdsapi>=0.7.7",
    "geopandas>=1.1.4",
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.1",
    "netcdf4>=1.7.4",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "path>=17.1.1",
    "rasterio>=1.5.1",
    "xarray>=2026.7.0",
]

[project.scripts]
portfolioproject = "portfolioproject:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false
